<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project page prototype</title>
<meta name="description" content="Static prototype of the stackfork dashboard Project page: checkouts, startup workflow, resources and configuration of one repository.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#131318" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<script src="theme-init.js"></script>
<link rel="stylesheet" href="../../../../internal/dashboard/static/tokens.css">
<link rel="stylesheet" href="../../../../internal/dashboard/static/app.css">
<link rel="stylesheet" href="prototype.css">
</head>
<body>
<a class="sr-only pp-skip" href="#main">Skip to content</a>
<div class="app">
<nav class="rail" aria-label="Views">
  <span class="rail-mark" aria-hidden="true">s</span>
  <a class="rail-item" href="#instances" title="Instances" data-rail="instances">
    <svg class="rail-icon" viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="2.5" width="12" height="4" rx="1"/><rect x="2" y="9.5" width="12" height="4" rx="1"/></svg><span class="sr-only">Instances</span><span class="rail-count">3/4</span>
  </a>
  <a class="rail-item" href="#repos" title="Repos" data-rail="repos" aria-current="page">
    <svg class="rail-icon" viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 4.5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg><span class="sr-only">Repos</span><span class="rail-count">3</span>
  </a>
  <a class="rail-item" href="#repos" title="Clean up">
    <svg class="rail-icon" viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.5 8.5h6l.5-8.5"/></svg><span class="sr-only">Clean up</span><span class="rail-count">4 GB</span>
  </a>
  <a class="rail-item" href="#repos" title="Settings">
    <svg class="rail-icon" viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><span class="sr-only">Settings</span><span class="rail-count"></span>
  </a>
</nav>
<div class="shell">
<header class="toolbar">
  <nav aria-label="Breadcrumb"><p class="pp-crumbs" id="crumbs"></p></nav>
  <div class="system-cluster">
    <span class="chip status-pill chip-ok"><span class="status-glyph" aria-hidden="true">&#9679;</span><span class="status-text">Docker &middot; ok</span></span>
    <span class="chip status-pill chip-ok"><span class="status-glyph" aria-hidden="true">&#9679;</span><span class="status-text">Proxy &middot; :80</span></span>
    <button id="theme-toggle" type="button" class="btn btn-ghost" aria-label="Theme: system. Switch to dark">Theme: system</button>
    <span id="version" class="mono">v0.9.0</span>
  </div>
</header>
<main id="main" class="view" tabindex="-1"></main>
</div>
</div>
<script src="data.js"></script>
<script src="prototype.js"></script>
</body>
</html>
