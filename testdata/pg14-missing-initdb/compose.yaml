services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    volumes:
      - local_db:/var/lib/postgresql/data/
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql

volumes:
  local_db:
