name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # The DMG comes after GoReleaser: the CLI release and its cask are
      # already published if this fails. Rerun the two steps by hand (CONTRIBUTING).
      - name: Build the macOS app
        run: scripts/build-macos-app.sh "${GITHUB_REF_NAME#v}"
      - name: Attach the DMG to the release
        run: gh release upload "$GITHUB_REF_NAME" dist/macos-app/*.dmg dist/macos-app/*.sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
