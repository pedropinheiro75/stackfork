# Optional Node/Bun Nuxt starting point. Match the project runtime and dependencies.
services:
  nginx:
    image: nginx:alpine
    ports:
      - target: 3000
        host_ip: 127.0.0.1
    volumes:
      - ${DEV_CHECKOUT:?}/.agent-dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ${DEV_CHECKOUT:?}
      dockerfile: .agent-dev/Dockerfile
      args:
        BUN_VERSION: ${DEV_BUN_VERSION:-1.3.9}
    working_dir: /app
    entrypoint: [bash, /usr/local/bin/stackfork-dev-entrypoint]
    command: [bun, run, dev]
    deploy:
      replicas: ${DEV_APP_REPLICAS:-1}
    volumes:
      - ${DEV_CHECKOUT:?}:/app
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
      - ${DEV_RUNTIME_ENV:?}:/app/.env:ro
      - ${DEV_CHECKOUT:?}/.agent-dev/registry.npmrc:/app/.npmrc:ro
    env_file:
      - ${DEV_RUNTIME_ENV:?}
    environment:
      DATABASE_URL: postgres://postgres:example@db:5432/${DEV_DB_NAME:?}
      DEV_HOSTNAME: ${DEV_HOSTNAME:?Use stackfork prepare to supply the instance hostname}
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: '3000'
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: '3000'
      DEV_SERVER_PORT: '3000'
      NPM_REGISTRY_HOST: ${NPM_REGISTRY_HOST:-npm.pkg.github.com}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:3000]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  db:
    image: ${DEV_DB_IMAGE:-postgres:17}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: ${DEV_DB_NAME:?}
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    volumes:
      - pgdata:${DEV_PGDATA_TARGET:-/var/lib/postgresql/data}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20

  smtp4dev:
    image: rnwood/smtp4dev:latest
    ports:
      - target: 80
        host_ip: 127.0.0.1
    volumes:
      - maildata:/smtp4dev

volumes:
  pgdata:
  maildata:
