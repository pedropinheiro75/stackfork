<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="stackfork logo: one stack forking into three isolated instances">
  <!-- the one Compose stack you already have (neutral gray: readable on
       both light and dark GitHub themes without a second logo variant) -->
  <rect x="60" y="18" width="120" height="20" rx="8" fill="#6b7280"/>
  <rect x="70" y="44" width="100" height="20" rx="8" fill="#6b7280" fill-opacity="0.85"/>
  <rect x="80" y="70" width="80" height="20" rx="8" fill="#6b7280" fill-opacity="0.7"/>

  <!-- forking into independent, isolated copies -->
  <path d="M120 98 C120 130, 62 118, 62 168" stroke="#2563eb" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M120 98 C120 138, 120 150, 120 168" stroke="#db2777" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M120 98 C120 130, 178 118, 178 168" stroke="#059669" stroke-width="8" stroke-linecap="round" fill="none"/>

  <circle cx="62" cy="186" r="18" fill="#2563eb"/>
  <circle cx="120" cy="186" r="18" fill="#db2777"/>
  <circle cx="178" cy="186" r="18" fill="#059669"/>
</svg>
